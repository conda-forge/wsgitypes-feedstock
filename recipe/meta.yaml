{% set name = "wsgitypes" %}
{% set version = "0.0.4" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/wsgitypes-{{ version }}.tar.gz
  sha256: 61d8594bb2ed254b03ae771caba95783c3f8d02911d36dc673e086d013ed2fef

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - mypy >=0.730
    - python >={{ python_min }}
    - typing-extensions

test:
  imports:
    - wsgitypes
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/shabbyrobe/wsgitypes
  summary: MyPy types for WSGI
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
